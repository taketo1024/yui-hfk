[package]
name = "yui-hfk"
version = "0.1.0"
authors = ["Taketo Sano <taketo1024@gmail.com>"]
description = "YUI-HFK: Heegaard Floer Knot Homology"
license = "MIT"
edition = "2024"
rust-version = "1.85"

[lib]
path = "src/lib/lib.rs"

[[bin]]
name = "yhf"
path = "src/bin/main.rs"

[features]
default = ["multithread"]
multithread = ["rayon"]
test-utils = []

[profile.release]
overflow-checks = true

[dependencies]
itertools = "0.13.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rayon = { version = "1.10.0", optional = true }
log = "0.4"
yui-core     = { path = "../yui/lib-core" }
yui-matrix   = { path = "../yui/lib-matrix" }
yui-homology = { path = "../yui/lib-homology" }
num-traits = "0.2.19"
num-integer = "0.1.46"
ahash = "0.8"
clap = { version = "4", features = ["derive"] }
delegate = "0.13.5"
