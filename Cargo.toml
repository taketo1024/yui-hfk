[workspace]
members = [
    "lib-hfk",
    "bin-yhf",
]
resolver = "3"

[workspace.package]
authors = ["Taketo Sano <taketo1024@gmail.com>"]
license = "MIT"
edition = "2024"
rust-version = "1.89"   # floor set by the yui crates (nalgebra 0.35)
repository = "https://github.com/taketo1024/yui-hfk"

[workspace.dependencies]
yui-hfk      = { version = "0.1.0", path = "lib-hfk" }
yui-core     = "0.5.0"
yui-homology = "0.5.0"
yui-matrix   = "0.5.0"

[profile.release]
overflow-checks = true
