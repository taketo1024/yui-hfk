[package]
name = "yhf"
description = "CLI for Heegaard Floer Knot Homology Computation"
version = "0.1.0"

authors.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace  = true

[lib]
doctest = false

[dependencies]
calamine = "0.36.1"
clap = { version = "4.6.1", features = ["derive"] }
env_logger = "0.11.5"
log = "0.4.29"
serde_json = "1.0.149"
ureq = "3.4.2"
yui-core.workspace = true
yui-hfk.workspace = true
yui-homology.workspace = true
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
