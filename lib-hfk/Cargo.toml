[package]
name = "yui-hfk"
description = "Heegaard Floer Knot Homology Library for YUI"
version = "0.1.0"

authors.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace  = true

[features]
default = ["multithread"]
multithread = ["rayon"]
test-utils = []

[dependencies]
ahash = "0.8.12"
cfg-if = "1.0.4"
delegate = "0.13.5"
itertools = "0.15.0"
log = "0.4.29"
num-integer = "0.1.46"
num-traits = "0.2.19"
rayon = { version = "1.12.0", optional = true }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
yui-core.workspace = true
yui-homology.workspace = true
yui-matrix.workspace = true
